name: Python application

# Run this workflow when code is pushed to main or a PR targets main.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Restrict default token permissions to read-only repository content.
permissions:
  contents: read

jobs:
  # Single CI job: install tools, run lint/tests, and publish test artifacts.
  build:
    # Use GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    steps:
    # Download repository source code into the runner workspace.
    - uses: actions/checkout@v4

    # Install the required Python version for this project.
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Upgrade pip and install all project dependencies from requirements.txt.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Install a stable Chrome browser build for Selenium tests.
    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    # Print installed Chrome version for troubleshooting in CI logs.
    - name: Verify Chrome
      run: google-chrome --version

    # Run flake8 checks (first command fails on critical issues; second reports full stats).
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # Ensure the Allure output folder exists before test execution.
    - name: Prepare report directory
      run: mkdir -p allure-results

    # Run pytest and write raw Allure results into allure-results/.
    - name: Test with pytest
      run: pytest --alluredir=allure-results

    # Upload Allure results even if tests fail so reports are still available.
    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Artifact name shown in the GitHub Actions run summary.
        name: allure-results
        # Folder containing raw Allure JSON files and attachments.
        path: allure-results/
        # Warn (do not fail) if no files were produced.
        if-no-files-found: warn
